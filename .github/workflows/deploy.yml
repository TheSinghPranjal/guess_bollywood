name: Guess Bollywood - Production Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Play Store
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout main
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Get Flutter dependencies
      # --------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # --------------------------------------------------
      # 5. Flutter Analyze
      # --------------------------------------------------
      - name: Flutter Analyze
        run: flutter analyze

      # --------------------------------------------------
      # 6. Flutter Tests
      # --------------------------------------------------
      - name: Flutter Test
        run: flutter test

      # --------------------------------------------------
      # 7. Calculate production version
      # --------------------------------------------------
      - name: Calculate build number
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          CURRENT_BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          NEW_BUILD_NUMBER=$((CURRENT_BUILD_NUMBER + GITHUB_RUN_NUMBER))

          echo "Version name: $VERSION_NAME"
          echo "Current pubspec build number: $CURRENT_BUILD_NUMBER"
          echo "GitHub run number: $GITHUB_RUN_NUMBER"
          echo "New Android version code: $NEW_BUILD_NUMBER"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEW_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 8. Restore Android signing keystore
      # --------------------------------------------------
      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/keystore/guess-bollywood-upload.jks

          test -f android/app/keystore/guess-bollywood-upload.jks

          echo "Keystore restored successfully"

      # --------------------------------------------------
      # 9. Create key.properties
      # --------------------------------------------------
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=${GITHUB_WORKSPACE}/android/app/keystore/guess-bollywood-upload.jks
          EOF

          echo "key.properties created"

      # --------------------------------------------------
      # 10. Build signed production AAB
      # --------------------------------------------------
      - name: Build App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      # --------------------------------------------------
      # 11. Verify AAB
      # --------------------------------------------------
      - name: Verify App Bundle
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab

          echo "AAB created successfully:"
          ls -lh build/app/outputs/bundle/release/app-release.aab

      # --------------------------------------------------
      # 12. Deploy to Google Play Production
      # --------------------------------------------------
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.lazy_bear_club.guess_bollywood
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed